spring:
  application:
    name: auth-service

    datasource:
      url: jdbc:postgresql://localhost:5432/chama_auth
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10           # = MaxPoolSize in .NET connection string
        minimum-idle: 2
        connection-timeout: 30000

    jpa:
      hibernate:
        ddl-auto: validate
      showsql: false
      properties:
        hibanate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true

    flyaway:
      enabled: true
      location: classpath:db/migration
      baseline-on-migrate: true

    data:
      redis:
        host: localhost
        port: 6379

    rabbitmq:
      host: localhost
      port: 5672
      username: guest
      password: guest

    jwt:
      secret: "256-bit-long"
      access-token-expiry-ms: 900000
      refresh-token-expiry-ms: 604800000

    server:
      port: 8081

    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics
      endpoint:
        health:
          show-details: true



